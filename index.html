<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Murder Mystery Countdown</title>

<style>
  body {
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 40px;
  }

  .countdown-grid {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 30px;
  }

  .countdown-unit {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 20px 24px 16px;
      min-width: 90px;
      position: relative;
      overflow: hidden;
  }

  .countdown-unit::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(to right, gold, hotpink);
  }

  .countdown-num {
      font-size: 3.2rem;
      line-height: 1;
      color: gold;
      display: block;
  }

  .countdown-tag {
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      color: #bbb;
      text-transform: uppercase;
      margin-top: 6px;
      display: block;
  }
</style>

</head>
<body>

<h1>A Murder Mystery Evening ✦ Click to Enter ✦</h1>

<!-- COUNTDOWN HTML -->
<div class="countdown-grid">
  <div class="countdown-unit">
    <span id="days" class="countdown-num">0</span>
    <span class="countdown-tag">DAYS</span>
  </div>
  <div class="countdown-unit">
    <span id="hours" class="countdown-num">0</span>
    <span class="countdown-tag">HOURS</span>
  </div>
  <div class="countdown-unit">
    <span id="minutes" class="countdown-num">0</span>
    <span class="countdown-tag">MINUTES</span>
  </div>
  <div class="countdown-unit">
    <span id="seconds" class="countdown-num">0</span>
    <span class="countdown-tag">SECONDS</span>
  </div>
</div>

<!-- COUNTDOWN SCRIPT -->
<script>
  // Event date: 27 July 2026, 5:00pm AEST (UTC+10)
  const eventDate = new Date("July 27, 2026 17:00:00 GMT+1000").getTime();

  function updateCountdown() {
    const now = new Date().getTime();
    const distance = eventDate - now;

    if (distance < 0) {
      document.querySelector(".countdown-grid").innerHTML = "The mystery begins!";
      return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = hours;
    document.getElementById("minutes").textContent = minutes;
    document.getElementById("seconds").textContent = seconds;
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);
</script>

</body>
</html>
